<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Stream Deck simulator</title>
<style>
  :root {
    --text: #e9e9ec;
    --muted: #9b9ea6;
    --room-light: #2c2f36;
    --room-dark: #0a0b0d;
    --body-top: #26272c;
    --body-bottom: #111114;
    --body-side: #060607;
    --focus: #7cb3ff;
    --ok: #5fd08a;
    --wait: #e2b24c;
    --down: #ef6a5f;
    --rows: 3;
    --cols: 5;
    --key-px: 72;
    /* Twice the real key size, shrunk to fit the window (an XL is 8 keys
       wide). A key takes 1.3 key sizes with its gap. */
    --key-size: max(
      40px,
      min(
        calc(var(--key-px) * 2px),
        calc((100vw - 6rem) / (var(--cols) * 1.3)),
        calc((100vh - 17rem) / (var(--rows) * 1.3))
      )
    );
    --gap: calc(var(--key-size) * 0.28);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 1.5rem 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    background: radial-gradient(ellipse 70% 60% at 50% 42%, var(--room-light), var(--room-dark));
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  header { text-align: center; }
  h1 {
    margin: 0;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #summary { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.8rem; opacity: 0.75; }

  /* The deck leans back on its stand, like a real one on a desk. */
  .desk {
    display: flex;
    flex-direction: column;
    align-items: center;
    perspective: 1600px;
  }

  .deck {
    position: relative;
    z-index: 1;
    padding: calc(var(--key-size) * 0.34);
    border-radius: calc(var(--key-size) * 0.3);
    background: linear-gradient(172deg, var(--body-top) 0%, #18181b 48%, var(--body-bottom) 100%);
    box-shadow:
      inset 0 1px 0 rgb(255 255 255 / 0.09),
      inset 0 -1px 0 rgb(0 0 0 / 0.7),
      0 calc(var(--key-size) * 0.09) 0 var(--body-side),
      0 calc(var(--key-size) * 0.09 + 1px) 0 rgb(255 255 255 / 0.04),
      0 calc(var(--key-size) * 0.5) calc(var(--key-size) * 0.7) rgb(0 0 0 / 0.55);
    transform: rotateX(16deg);
    transform-origin: 50% 100%;
  }

  .stand {
    width: 58%;
    height: calc(var(--key-size) * 0.42);
    margin-top: calc(var(--key-size) * -0.05);
    background: linear-gradient(#232327, #151518 60%, #0b0b0d);
    clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%);
    border-radius: 0 0 6px 6px;
  }

  .floor-shadow {
    width: 88%;
    height: calc(var(--key-size) * 0.3);
    margin-top: calc(var(--key-size) * -0.16);
    background: radial-gradient(ellipse at 50% 50%, rgb(0 0 0 / 0.7), transparent 70%);
  }

  #grid {
    --brightness: 1;
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--key-size));
    grid-auto-rows: var(--key-size);
    gap: var(--gap);
  }

  /* A transparent cap over a small screen: the picture sits a little inside
     the cap, under a glossy dome. */
  .key {
    position: relative;
    appearance: none;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 20%;
    background: radial-gradient(circle at 50% 38%, #0d0d10, #030304 72%);
    box-shadow:
      0 0 0 calc(var(--key-size) * 0.028) #000,
      0 calc(var(--key-size) * 0.045) 0 calc(var(--key-size) * 0.028) #000,
      inset 0 1px 0 rgb(255 255 255 / 0.1);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 80ms ease-out, box-shadow 80ms ease-out;
  }

  .key::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background:
      linear-gradient(162deg, rgb(255 255 255 / 0.2) 0%, rgb(255 255 255 / 0.05) 24%, transparent 42%),
      radial-gradient(140% 100% at 50% 118%, rgb(0 0 0 / 0.3), transparent 55%);
    box-shadow:
      inset 0 0 0 1px rgb(255 255 255 / 0.05),
      inset 0 -3px 6px rgb(0 0 0 / 0.45);
  }

  .key img {
    position: absolute;
    inset: 7%;
    display: block;
    width: 86%;
    height: 86%;
    border-radius: 11%;
    object-fit: cover;
    pointer-events: none;
    filter: brightness(var(--brightness));
  }

  .key img[hidden] { display: none; }

  .key.pressed {
    transform: translateY(calc(var(--key-size) * 0.035));
    box-shadow:
      0 0 0 calc(var(--key-size) * 0.028) #000,
      0 calc(var(--key-size) * 0.01) 0 calc(var(--key-size) * 0.028) #000,
      inset 0 1px 0 rgb(255 255 255 / 0.06);
  }

  .key.pressed::after {
    background: linear-gradient(162deg, rgb(255 255 255 / 0.1) 0%, transparent 38%);
  }

  .key:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: calc(var(--key-size) * 0.06);
  }

  .status {
    margin: 0;
    padding: 0.3rem 0.8rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    border-radius: 999px;
    background: rgb(255 255 255 / 0.05);
    color: var(--muted);
    font-size: 0.85rem;
  }

  .status::before {
    content: "";
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 50%;
    background: var(--wait);
  }

  .status[data-state="connected"] { color: var(--text); }
  .status[data-state="connected"]::before {
    background: var(--ok);
    box-shadow: 0 0 6px var(--ok);
  }
  .status[data-state="offline"]::before { background: var(--down); }

  .notice {
    margin: 0;
    max-width: 40rem;
    padding: 0.4rem 0.9rem;
    border: 1px solid rgb(239 106 95 / 0.5);
    border-radius: 0.6rem;
    background: rgb(239 106 95 / 0.15);
    color: var(--text);
    font-size: 0.85rem;
    text-align: center;
  }
  .notice[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .key { transition: none; }
    .key.pressed { transform: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Stream Deck simulator</h1>
  <p id="summary"></p>
</header>
<div class="desk">
  <main class="deck">
    <div id="grid" role="group" aria-label="Keys"></div>
  </main>
  <div class="stand" aria-hidden="true"></div>
  <div class="floor-shadow" aria-hidden="true"></div>
</div>
<p id="status" class="status" role="status" data-state="waiting">Waiting for the player…</p>
<p id="notice" class="notice" role="alert" hidden></p>
<script>
"use strict";

const POLL_MS = 200;
const PRESS_EFFECT_MS = 140;
// The real deck can go darker, but the page must stay readable.
const MIN_BRIGHTNESS = 0.15;
const STATUS_TEXT = {
  connected: "Player connected",
  waiting: "Waiting for the player…",
  offline: "Simulator not reachable",
};

const grid = document.getElementById("grid");
const summary = document.getElementById("summary");
const statusLine = document.getElementById("status");
const notice = document.getElementById("notice");
let shape = "";
let keys = [];

function setStatus(state) {
  if (statusLine.dataset.state === state) return;
  statusLine.dataset.state = state;
  statusLine.textContent = STATUS_TEXT[state];
}

function build(info) {
  const root = document.documentElement.style;
  root.setProperty("--rows", info.rows);
  root.setProperty("--cols", info.cols);
  root.setProperty("--key-px", info.key_size);
  summary.textContent = `${info.rows} × ${info.cols} keys, ${info.key_size} px each`;
  keys = Array.from({ length: info.rows * info.cols }, (_, n) => makeKey(n));
  grid.replaceChildren(...keys.map((key) => key.button));
}

function makeKey(n) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "key";
  button.setAttribute("aria-label", `Key ${n + 1}`);

  const img = document.createElement("img");
  img.alt = "";
  img.draggable = false;
  img.hidden = true;
  img.addEventListener("load", () => { img.hidden = false; });
  img.addEventListener("error", () => { img.hidden = true; });
  button.append(img);

  let effect;
  const press = () => {
    button.classList.add("pressed");
    clearTimeout(effect);
    effect = setTimeout(() => button.classList.remove("pressed"), PRESS_EFFECT_MS);
    fetch(`/api/press/${n}`, { method: "POST" }).catch(() => setStatus("offline"));
  };
  button.addEventListener("pointerdown", (event) => {
    if (event.button === 0) press();
  });
  // A click with detail 0 comes from the keyboard (Enter, Space) or a screen
  // reader; mouse and touch clicks were already pressed on pointerdown.
  button.addEventListener("click", (event) => {
    if (event.detail === 0) press();
  });

  return { n, button, img, version: 0 };
}

function show(key, version) {
  if (key.version === version) return;
  key.version = version;
  if (version === 0) {
    key.img.hidden = true;
    key.img.removeAttribute("src");
  } else {
    key.img.src = `/api/keys/${key.n}?v=${version}`;
  }
}

function render(state) {
  const { info } = state;
  const next = `${info.rows}x${info.cols}x${info.key_size}`;
  if (next !== shape) {
    shape = next;
    build(info);
  }
  state.versions.forEach((version, n) => {
    if (keys[n]) show(keys[n], version);
  });
  const brightness = Math.max(MIN_BRIGHTNESS, state.brightness / 100);
  grid.style.setProperty("--brightness", brightness);
  setStatus(state.connected ? "connected" : "waiting");
  notice.hidden = !state.notice;
  notice.textContent = state.notice ?? "";
}

async function poll() {
  try {
    const reply = await fetch("/api/state", { cache: "no-store" });
    if (!reply.ok) throw new Error(`HTTP ${reply.status}`);
    render(await reply.json());
  } catch {
    setStatus("offline");
  } finally {
    setTimeout(poll, POLL_MS);
  }
}

poll();
</script>
</body>
</html>
