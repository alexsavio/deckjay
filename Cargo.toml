[package]
name = "deckjay"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A music player with no screen: pictures on an Elgato Stream Deck, one press plays on a Chromecast, a HEOS receiver, Spotify Connect or the computer's own sound output"
license = "MIT"
repository = "https://github.com/alexsavio/deckjay"
readme = "README.md"
keywords = ["stream-deck", "music-player", "chromecast", "spotify", "raspberry-pi"]
categories = ["multimedia::audio"]
# Dev tooling stays out of the crate; config.example.toml, the udev rule and
# the docs go in, because the README tells cargo-install users to use them.
exclude = [
    ".github/",
    ".dockerignore",
    ".editorconfig",
    ".gitignore",
    "CLAUDE.md",
    "Dockerfile",
    "cliff.toml",
    "compose.sim.yaml",
    "docker-compose.yml",
    "docs/images/",
    "justfile",
    "rust-toolchain.toml",
]

[dependencies]
anyhow = "1"
axum = "0.8"
cpal = "0.18"
elgato-streamdeck = "0.13"
hidapi = "2.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
percent-encoding = "2"
rtrb = "0.4"
rust_cast = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["aac", "flac", "id3v1", "id3v2", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }
toml = "1"
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }
# rust_cast uses the aws-lc-rs engine; a second engine (ring) would make
# rustls panic when it picks a default, so ureq gets this one explicitly.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23"
rss = { version = "2.1", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
signal-hook = { version = "0.4", default-features = false }

[dev-dependencies]
flate2 = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pixel and volume math on small, bounded numbers: these casts are intended.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Reads `shelf` as a typo of `self`.
similar_names = "allow"

[profile.release]
strip = true
lto = "thin"
