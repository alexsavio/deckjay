name: Weekly Audit

# CI runs cargo audit only on a push or a pull request; this catches a new
# RustSec advisory against Cargo.lock while nothing is pushed.
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - name: Install cargo-audit
        uses: taiki-e/install-action@b651345a718c8f44efa2460560b3dbf29cbd7ee1  # v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit
