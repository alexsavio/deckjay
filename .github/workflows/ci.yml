name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUMDL_VERSION: "0.2.46"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout of a private repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      # cpal needs ALSA and hidapi needs udev on Linux.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      # Installs the version pinned in rust-toolchain.toml, with clippy and rustfmt.
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: cargo-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Cache rumdl
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.cargo/bin/rumdl
          key: rumdl-${{ env.RUMDL_VERSION }}
      - name: Install rumdl
        run: command -v rumdl || cargo install rumdl@"$RUMDL_VERSION"

      - name: Check Markdown
        run: rumdl check README.md CLAUDE.md docs/*.md

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: API docs
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read  # checkout of a private repo
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Install Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: cargo-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout of a private repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install
      - name: Install cargo-audit
        uses: taiki-e/install-action@b651345a718c8f44efa2460560b3dbf29cbd7ee1  # v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout of a private repo
    needs: check
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      # The image the Pi runs is arm64; this builds the same Dockerfile for
      # the runner, to catch a broken build before a deploy.
      - name: Build the image
        run: docker build --tag kids-deck:ci .
