# Copy to config.toml and adjust.

# Folder with one sub-folder per album (relative to this file, or absolute).
# Each album folder holds audio files (mp3, m4a, flac, ogg, wav) and a cover
# image (cover.jpg / folder.jpg / any jpg or png). Number prefixes like
# "01 " control the order of albums and tracks.
music_dir = "music"

# IP address of the speaker. Find it in the speaker's app or your router.
# Tip: give it a fixed IP (DHCP reservation) in your router.
speaker_host = "192.168.1.50"

# "cast" for Chromecast built-in speakers (such as the JBL Authentics), or
# "heos" for Denon / Marantz HEOS receivers and speakers.
# speaker_type = "cast"

# Control port of the speaker. The default depends on speaker_type:
# 8009 for cast, 1255 for heos.
# speaker_port = 8009

# Port of the built-in web server the speaker downloads the music from.
# http_port = 8765

# The address the speaker uses to reach this computer. Detected automatically;
# set it only if detection picks the wrong network interface. An IPv4 address
# or a host name, without "http://" or a port.
# advertise_host = "192.168.1.20"

# Volume is 0.0–1.0 of the speaker's range. max_volume is a hard ceiling for
# the deck's volume keys. (It can't stop someone using the speaker's own
# buttons, its app or a voice assistant.) volume_step is how much one press
# changes the volume, from 0.01 to 0.5.
max_volume = 0.4
start_volume = 0.2
volume_step = 0.05

# Stream Deck brightness in percent.
brightness = 60
