# Copy to config.toml and adjust.

# IP address of the speaker. Find it in the speaker's app or your router.
# Tip: give it a fixed IP (DHCP reservation) in your router.
# Not used when speaker_type = "local".
speaker_host = "192.168.1.50"

# "cast" for Chromecast built-in speakers (such as the JBL Authentics),
# "heos" for Denon / Marantz HEOS receivers and speakers, or
# "local" for this computer's own sound output (the Pi's headphone jack,
# HDMI or a USB sound card).
# speaker_type = "cast"

# For "local": part of the sound output's name. `just doctor` lists them.
# On a Raspberry Pi: "Headphones" (the jack) or "HDMI". Default: the system's
# default output.
# audio_device = "Headphones"

# Control port of the speaker. The default depends on speaker_type:
# 8009 for cast, 1255 for heos.
# speaker_port = 8009

# Port of the built-in web server the speaker downloads the music from.
# http_port = 8765

# The address the speaker uses to reach this computer. Detected automatically;
# set it only if detection picks the wrong network interface. An IPv4 address
# or a host name, without "http://" or a port.
# advertise_host = "192.168.1.20"

# Volume is 0.0–1.0 of the speaker's range. max_volume is a hard ceiling for
# the deck's volume keys. (It can't stop someone using the speaker's own
# buttons, its app or a voice assistant.) volume_step is how much one press
# changes the volume, from 0.01 to 0.5.
max_volume = 0.4
start_volume = 0.2
volume_step = 0.05

# Stream Deck brightness in percent.
brightness = 60

# Folder where the deck saves what it remembers: the shelf and page it
# shows, and where each audiobook stopped. Relative to this file, or
# absolute; it must be writable.
# state_dir = "state"

# What the deck plays comes from sources: one [[source]] table each. They go
# at the end of the file: TOML reads every key after a [[source]] line as
# part of that source. Each source is one shelf on the deck.
#
# type  "music", "audiobook" or "story" (stories and sound effects).
# name  Optional; the default is the type. Letters, digits, - and _ only.
#       Two sources of one type need different names.
# path  The folder, relative to this file or absolute (any drive). Every
#       folder in it is one key: its audio files and those one folder down
#       (CD1/, CD2/). A loose audio file is one key too, with the picture of
#       the same name as its cover (Song.mp3 and Song.jpg). A folder's cover
#       is cover.jpg / folder.jpg / any jpg or png in it. Number prefixes
#       like "01 " set the order. Files: mp3, m4a, m4b, aac, flac, ogg, wav.
#
# picture  Optional: the shelf key's picture (png or jpg), relative to this
#          file or absolute. Without it, the key shows the kind of the
#          source (a note, a book, a star) on a colour.
# color    Optional: "#rrggbb", the colour of keys without a picture.
#
# A [source.item."<name>"] table sets the picture or colour of one key, by
# the name of its folder or file. A key.png or key.jpg in an item's folder
# is its picture too. These pictures are only for the deck: the speaker
# shows the cover.
#
# In Docker, a folder outside ./music also needs a volume in
# docker-compose.yml.

[[source]]
type = "music"
path = "music"
