# For the Raspberry Pi. Put this file next to config.toml and the music folder.
services:
  kids-deck:
    image: kids-deck:latest
    restart: unless-stopped
    # Host networking: the speaker must reach the web server, and replies from
    # the speaker must reach us.
    network_mode: host
    # Simplest way to see the Stream Deck, including unplugging/replugging it.
    privileged: true
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./config.toml:/app/config.toml:ro
      - ./music:/app/music:ro
    environment:
      - RUST_LOG=info
